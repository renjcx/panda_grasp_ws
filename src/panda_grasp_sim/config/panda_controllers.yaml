controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    fp3_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    fp3_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - fp3_joint1
      - fp3_joint2
      - fp3_joint3
      - fp3_joint4
      - fp3_joint5
      - fp3_joint6
      - fp3_joint7
      - fp3_finger_joint1
      - fp3_finger_joint2

fp3_arm_controller:
  ros__parameters:
    joints:
      - fp3_joint1
      - fp3_joint2
      - fp3_joint3
      - fp3_joint4
      - fp3_joint5
      - fp3_joint6
      - fp3_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 10.0

fp3_gripper_controller:
  ros__parameters:
    joints:
      # Gazebo Harmonic 不执行 URDF mimic 约束，两个手指必须都由控制器驱动
      - fp3_finger_joint1
      - fp3_finger_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 10.0
    # 允许只包含部分关节的轨迹（例如只带 finger_joint1 的目标）
    allow_partial_joints_goal: true
    gains:
      fp3_finger_joint1:
        p: 500.0
        i: 10.0
        d: 5.0
        i_clamp: 50.0
        ff_velocity: 0.0
      fp3_finger_joint2:
        p: 500.0
        i: 10.0
        d: 5.0
        i_clamp: 50.0
        ff_velocity: 0.0
